<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>DigitalMate Bench</title>
    <link rel="stylesheet" href="style.css?v=20261121.1" />
  </head>
  <body>
    <main class="page">
      <div id="error" class="error" hidden></div>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-head">
          <h1 id="hero-title">GAIA 全量（165）</h1>
          <p id="source-line" class="muted"></p>
        </div>
      </section>

      <section class="block" id="gaia-block" aria-labelledby="gaia-title">
        <div class="block-head">
          <h2 id="gaia-title">选择运行</h2>
          <p id="gaia-meta" class="muted small"></p>
          <div class="gaia-runs" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 2px">
            <label class="muted small">运行
              <select id="gaia-run" aria-label="选择要查看的 GAIA 运行"
                style="font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)"></select>
            </label>
            <a id="gaia-detail" class="small" href="../data/bench/gaia-165/index.html">逐题明细（含每例 token）→</a>
          </div>
        </div>
        <div id="gaia-kpis" class="cards"></div>
        <div id="gaia-chart" class="gaia-chart"></div>
        <div class="scroll" style="margin-top: 12px"><table id="gaia-buckets" class="grid"></table></div>
        <p id="gaia-note" class="muted small" style="margin-top: 8px"></p>
        <details id="gaia-details" style="margin-top: 10px">
          <summary class="muted small" style="cursor: pointer">展开逐条结果</summary>
          <div class="scroll" style="margin-top: 8px"><table id="gaia-tasks" class="grid"></table></div>
        </details>
      </section>

      <section class="block" aria-labelledby="trend-title">
        <div class="block-head">
          <h2 id="trend-title">GAIA 全量趋势</h2>
        </div>
        <div id="gaia-trend" class="chart" aria-live="polite"></div>
        <p id="gaia-trend-note" class="muted small"></p>
      </section>

      </main>
    <script src="app.js?v=20261112.2"></script>
  </body>
</html>
