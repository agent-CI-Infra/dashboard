<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>DigitalMate Bench</title>
    <link rel="stylesheet" href="style.css?v=20261112.1" />
  </head>
  <body>
    <main class="page">
      <div id="error" class="error" hidden></div>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-head">
          <h1 id="hero-title">Bench</h1>
          <p id="source-line" class="muted"></p>
        </div>
        <div id="latest" class="cards" aria-live="polite"></div>
      </section>

      <section class="block" id="gaia-block" aria-labelledby="gaia-title" hidden>
        <div class="block-head">
          <h2 id="gaia-title">GAIA 全量（165）</h2>
          <p id="gaia-meta" class="muted small"></p>
        </div>
        <div id="gaia-kpis" class="cards"></div>
        <div class="scroll" style="margin-top: 12px"><table id="gaia-buckets" class="grid"></table></div>
        <p id="gaia-note" class="muted small" style="margin-top: 8px"></p>
        <details id="gaia-details" style="margin-top: 10px">
          <summary class="muted small" style="cursor: pointer">展开逐条结果</summary>
          <div class="scroll" style="margin-top: 8px"><table id="gaia-tasks" class="grid"></table></div>
        </details>
      </section>

      <section class="block" aria-labelledby="trend-title">
        <div class="block-head">
          <h2 id="trend-title">趋势</h2>
          <div class="segmented" role="group" aria-label="趋势指标">
            <button type="button" data-metric="pass" class="active">通过率</button>
            <button type="button" data-metric="latency">p50 延迟</button>
          </div>
        </div>
        <div id="chart" class="chart" aria-live="polite"></div>
        <p id="chart-note" class="muted small"></p>
      </section>

      <section class="block" aria-labelledby="summary-title">
        <h2 id="summary-title">本期汇总</h2>
        <p class="muted small">最近一次 Bench / Nightly 的汇总。E2E 结果看顶部 E2E 页。</p>
        <div class="scroll"><table id="summary" class="grid"></table></div>
      </section>

      <section class="block" aria-labelledby="history-title">
        <h2 id="history-title">运行记录</h2>
        <p class="muted small">每轮 Nightly / Bench 一条记录；点击运行号查看完整日志。</p>
        <div class="scroll"><table id="history" class="grid"></table></div>
      </section>
    </main>
    <script src="app.js?v=20261112.1"></script>
  </body>
</html>
