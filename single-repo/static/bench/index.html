<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>DigitalMate Bench</title>
    <link rel="stylesheet" href="style.css?v=20261105.2" />
  </head>
  <body>
    <main class="page">
      <div id="error" class="error" hidden></div>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-head">
          <h1 id="hero-title">Bench</h1>
          <p id="source-line" class="muted"></p>
        </div>
        <div id="latest" class="cards" aria-live="polite"></div>
      </section>

      <section class="block" aria-labelledby="summary-title">
        <h2 id="summary-title">本期汇总</h2>
        <p class="muted small">最近一次 Nightly 的 bench summary。E2E 结果看顶部 E2E 页。</p>
        <div class="scroll"><table id="summary" class="grid"></table></div>
      </section>

      <section class="block" aria-labelledby="history-title">
        <h2 id="history-title">运行记录</h2>
        <p class="muted small">每晚一次 Nightly，默认只跑一个 bench task；点击运行号查看完整日志。</p>
        <div class="scroll"><table id="history" class="grid"></table></div>
      </section>
    </main>
    <script src="app.js?v=20261105.2"></script>
  </body>
</html>
