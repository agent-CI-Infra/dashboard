<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>DigitalMate 自建 Runner 状态</title>
    <link rel="stylesheet" href="style.css?v=20261113.1" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <h1>自建 Runner 状态<span id="count" class="muted"></span></h1>
        <p class="muted small">
          数据来自 GitHub Actions Runners API，由 Collect DigitalMate runners 工作流每 15 分钟采集，页面每分钟自动刷新。快照时间：<time id="updated">载入中…</time>
        </p>
      </header>

      <p id="warn" class="banner" hidden></p>
      <p id="error" class="error" hidden></p>

      <section id="cards" class="cards" aria-label="Runner 当前状态"></section>

      <section class="block" aria-labelledby="tl-title">
        <h2 id="tl-title">可用性时间线</h2>
        <p id="tl-note" class="muted small"></p>
        <div id="timeline" class="timeline" role="img" aria-label="每个自建 runner 最近 24 小时的在线状态时间线"></div>
        <p class="legend" aria-label="时间线图例">
          <span><i class="sw ok"></i>在线</span>
          <span><i class="sw busy"></i>在线 · 忙碌</span>
          <span><i class="sw down"></i>离线</span>
          <span><i class="sw na"></i>无数据</span>
        </p>
      </section>
    </main>
    <script src="app.js?v=20261113.1"></script>
  </body>
</html>
