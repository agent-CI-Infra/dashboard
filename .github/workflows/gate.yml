name: CI Gates

# Dogfood of ci-gates. The runner lives in agent-CI-Infra/ci-gates and is
# checked out at the v1 tag; this workflow is the dashboard-specific wiring.
#
# Required check for branch protection / merge queue:
#   CI Gates / gate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    # Daily lane: 16:00 UTC = 00:00 Asia/Shanghai.
    - cron: '0 16 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    env:
      # pull_request: report the PR head, not GitHub's merge commit.
      CI_GATES_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ci-gates
        uses: actions/checkout@v4
        with:
          repository: agent-CI-Infra/ci-gates
          ref: v1
          path: .ci-gates

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install test browsers
        # Only the daily lane runs the browser test suite.
        if: github.event_name == 'schedule'
        run: npm run test:browser:install

      - name: Run gate lanes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .ci-gates/scripts/gate/gate.mjs run --config .github/ci-gates.json --event "$GITHUB_EVENT_NAME"

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gates-reports
          path: gate-reports/
          if-no-files-found: warn
          retention-days: 30
