name: Collect DigitalMate ST

# Copies the DigitalMate ST summary from the latest Nightly into
# site/data/st.json on the imported `digitalmate` branch, then redeploys the
# board. The ST tab reads that file; it is not part of snapshot.json. Bench and
# E2E results stay on their own tabs and are collected separately.
#
# Requires DIGITALMATE_TOKEN (fine-grained PAT on openJiuwen-ai/DigitalMate)
# with Actions: read. Without the secret the job is a no-op.
on:
  schedule:
    # Nightly starts at 18:00 UTC and takes 1-2h. Poll every two hours and only
    # publish when the run id or the summaries changed.
    - cron: '40 */2 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Nightly run id (empty = latest completed Nightly on main)'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-digitalmate-st
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check source token
        id: token
        env:
          TOKEN: ${{ secrets.DIGITALMATE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '::warning::DIGITALMATE_TOKEN is not configured; skipping DigitalMate ST collection.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the latest Nightly artifacts
        id: fetch
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DIGITALMATE_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          repo=openJiuwen-ai/DigitalMate
          id="$INPUT_RUN_ID"
          if [ -z "$id" ]; then
            id=$(gh api "repos/$repo/actions/workflows/nightly.yml/runs?event=schedule&branch=main&status=completed&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi
          if [ -z "$id" ]; then
            id=$(gh api "repos/$repo/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi
          if [ -z "$id" ]; then
            echo '::notice::No completed Nightly run yet.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$repo/actions/runs/$id" \
            --jq '{id,html_url,conclusion,status,created_at,head_sha,event}' > /tmp/nightly-run.json
          gh api "repos/$repo/actions/runs/$id/artifacts?per_page=100" > /tmp/nightly-artifacts.json
          # The direct-backend summary and the live-wire lane are separate artifacts;
          # a missing live-wire artifact just leaves those rows grey.
          st_name=$(jq -r '[.artifacts[] | select(.name | startswith("digitalmate-st-")) | .name] | first // empty' /tmp/nightly-artifacts.json)
          lw_name=$(jq -r '[.artifacts[] | select(.name | startswith("digitalmate-st-live-wire-")) | .name] | first // empty' /tmp/nightly-artifacts.json)
          rm -rf /tmp/st /tmp/lw
          if [ -n "$st_name" ]; then
            gh run download "$id" -R "$repo" -n "$st_name" -D /tmp/st
          else
            echo '::notice::Nightly run has no ST artifact (ST likely disabled); not recording an empty run.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$lw_name" ]; then
            gh run download "$id" -R "$repo" -n "$lw_name" -D /tmp/lw || echo '::warning::live-wire artifact download failed; leaving those rows grey'
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

      - name: Merge summaries
        if: steps.fetch.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git fetch origin digitalmate:refs/remotes/origin/digitalmate
          if git cat-file -e origin/digitalmate:site/data/st.json 2>/dev/null; then
            git show origin/digitalmate:site/data/st.json > /tmp/previous-st.json
          fi
          node scripts/merge-st-summary.mjs \
            --st /tmp/st --run /tmp/nightly-run.json \
            --live-wire /tmp/lw \
            --previous /tmp/previous-st.json --out /tmp/st.json

      - name: Update digitalmate branch
        id: update
        if: steps.fetch.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git fetch origin digitalmate:refs/remotes/origin/digitalmate
          git checkout -B digitalmate origin/digitalmate
          if git cat-file -e HEAD:site/data/st.json 2>/dev/null; then
            if node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('site/data/st.json'));const b=JSON.parse(fs.readFileSync('/tmp/st.json'));delete a.updatedAt;delete b.updatedAt;process.exit(JSON.stringify(a)===JSON.stringify(b)?0:1)"; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              echo 'st data unchanged'
              exit 0
            fi
          fi
          mkdir -p site/data
          cp /tmp/st.json site/data/st.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/st.json
          git commit -m 'chore(digitalmate): update ST results'
          git pull --rebase origin digitalmate
          git push origin HEAD:digitalmate
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Deploy dashboard
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
