name: Continuous Integration

on:
  pull_request:
    branches:
      - main

jobs:
  install-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the code
        run: npm run lint

      # - name: Analyze unused files and dependencies
      #   run: npm run knip

      - name: Run Prettier check
        run: npm run format:check

      - name: Install browsers
        run: npm run test:browser:install

      - name: Test gate collectors
        run: npm run test:collector

      - name: Test ci-gates runner
        run: npm run test:gate

      - name: Run tests
        run: npm test

      - name: Build the project
        run: npm run build
