name: Continuous Integration

on:
  pull_request:
    branches:
      - main

jobs:
  install-lint-build:
    # Playwright 1.59.1 does not support ubuntu-26.04 browser dependencies.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the code
        run: npm run lint

      # - name: Analyze unused files and dependencies
      #   run: npm run knip

      - name: Run Prettier check
        run: npm run format:check

      - name: Install browsers
        run: npm run test:browser:install

      - name: Test gate collectors
        run: npm run test:collector

      - name: Test read-only trajectory archive
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_sfs_trajectory_archive.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_collect_production*traces.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_production_sfs_freshness.py' -v
          node --test scripts/trajectory-archive.test.mjs scripts/production-detailed-trace.test.mjs

      - name: Run tests
        run: npm test

      - name: Build the project
        run: npm run build
