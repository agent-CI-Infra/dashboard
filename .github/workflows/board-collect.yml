name: Collect board data

# Refresh every `board/<owner>/<repo>` data branch. A board branch contains
# only board-config.json, site/data/ and .sync/; the collector code stays on
# main and is copied into the branch checkout for each run.
#
# Public sources are read with the workflow token. Private sources are read
# with the single read-only PRIVATE_SOURCE_TOKEN repository secret; publishing
# to the board branch always uses the workflow token.

on:
  schedule:
    # Daily after the community collection. GitHub may delay scheduled runs.
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      board:
        description: Optional board key (owner/repository); empty collects every board
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: collect-boards
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      has_boards: ${{ steps.list.outputs.has_boards }}
    steps:
      - name: List board branches
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD: ${{ github.event.inputs.board }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys
          board = (os.environ.get("BOARD") or "").strip().lower().strip("/")
          if board:
              if not re.fullmatch(r"[a-z0-9_.-]+/[a-z0-9_.-]+", board):
                  raise SystemExit(f"invalid board key: {board!r}")
              refs = [f"refs/heads/board/{board}"]
          else:
              output = subprocess.check_output([
                  "gh", "api", "--paginate",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/git/matching-refs/heads/board/",
                  "--jq", ".[].ref",
              ], text=True)
              refs = [line.strip() for line in output.splitlines() if line.strip()]
          items = []
          for ref in refs:
              key = ref.removeprefix("refs/heads/board/")
              if not re.fullmatch(r"[a-z0-9_.-]+/[a-z0-9_.-]+", key):
                  continue
              items.append({"board": key, "branch": ref.removeprefix("refs/heads/")})
          has_boards = "true" if items else "false"
          if not items:
              # Keep the matrix non-empty; the collect job is skipped by `if`.
              items = [{"board": "__none__", "branch": "__none__"}]
          print("matrix=" + json.dumps({"include": items}, separators=(",", ":")))
          print("has_boards=" + has_boards)
          print(f"boards: {len(items) if has_boards == 'true' else 0}", file=sys.stderr)
          PY

  collect:
    needs: prepare
    if: needs.prepare.outputs.has_boards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: board-collect-${{ matrix.board }}
      cancel-in-progress: false
    steps:
      - name: Checkout collector code
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout board data branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: board

      # Kept as its own step so a failed run can be recognised (by name) as a
      # missing dashboard secret rather than a bad source or token.
      - name: Check PRIVATE_SOURCE_TOKEN
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          try:
              config = json.loads(Path("board/board-config.json").read_text(encoding="utf-8"))
          except (OSError, ValueError):
              config = {}
          if str(config.get("visibility", "")).lower() == "private" and not os.environ.get("PRIVATE_TOKEN", "").strip():
              print(
                  "::error title=PRIVATE_SOURCE_TOKEN missing::"
                  "This private board needs the dashboard repository secret PRIVATE_SOURCE_TOKEN "
                  "(a read-only token for the private source). Add it once under Settings -> "
                  "Secrets and variables -> Actions, then re-run this workflow.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Validate source repository
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          SOURCE: ${{ matrix.board }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys
          from pathlib import Path

          source = os.environ["SOURCE"]
          private_token = (os.environ.get("PRIVATE_TOKEN") or "").strip()
          public_token = (os.environ.get("GH_TOKEN") or "").strip()

          try:
              config = json.loads(Path("board/board-config.json").read_text(encoding="utf-8"))
          except (OSError, ValueError):
              config = {}
          visibility = str(config.get("visibility") or "").strip().lower()

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          def read(token):
              env = dict(os.environ, GH_TOKEN=token, GITHUB_TOKEN=token)
              proc = subprocess.run(
                  ["gh", "api", f"repos/{source}"],
                  env=env, capture_output=True, text=True,
              )
              if proc.returncode != 0:
                  return None
              try:
                  return json.loads(proc.stdout)
              except ValueError:
                  return None

          if visibility == "private":
              if not private_token:
                  fail(f"{source} is recorded as private and needs the dashboard repository secret PRIVATE_SOURCE_TOKEN")
              meta = read(private_token)
              if not meta:
                  fail(f"PRIVATE_SOURCE_TOKEN cannot read private source {source}; check that the token is valid and has access")
          elif visibility == "public":
              meta = read(public_token)
              if not meta:
                  fail(f"board-config.json records {source} as public, but the workflow token cannot read it; recreate the board")
              if meta.get("private") or meta.get("visibility", "public") != "public":
                  fail(f"board-config.json records {source} as public, but it is not public; recreate the board")
          else:
              # Older boards have no visibility. Probe public first, then the
              # private token, so validation still accepts exactly the two
              # allowed cases.
              meta = read(public_token)
              if meta and not meta.get("private") and meta.get("visibility", "public") == "public":
                  visibility = "public"
              else:
                  if not private_token:
                      fail(f"{source} is not public and the dashboard repository secret PRIVATE_SOURCE_TOKEN is not set")
                  meta = read(private_token)
                  if not meta:
                      fail(f"{source} is neither a public repository nor a private repository readable with PRIVATE_SOURCE_TOKEN")
                  visibility = "private"

          print(f"visibility={visibility}")
          print(f"full_name={meta.get('full_name') or source}")
          PY

      - name: Prepare collector
        run: |
          set -euo pipefail
          cp -R code/single-repo/gsb code/single-repo/static code/single-repo/publish.py board/

      - name: Collect and publish
        env:
          # Source reads: the private token for private boards, otherwise the
          # workflow token. Publishing always uses GSB_PUBLISH_TOKEN below.
          SOURCE_TOKEN: ${{ steps.source.outputs.visibility == 'private' && secrets.PRIVATE_SOURCE_TOKEN || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSB_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSB_ALLOW_PRIVATE: ${{ steps.source.outputs.visibility == 'private' && '1' || '0' }}
          SOURCE: ${{ matrix.board }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          cd board
          PYTHONDONTWRITEBYTECODE=1 python3 publish.py \
            --repo "$SOURCE" \
            --settings board-config.json \
            --output site \
            --publish-repo "${{ github.repository }}" \
            --branch "$BRANCH" \
            --incremental \
            --publish-data-only \
            --source-token-env SOURCE_TOKEN
