name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh data and redeploy every hour.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh community data
        # Re-collect before building so the deployed site reflects the latest
        # GitHub data. The collector degrades gracefully: on failure it keeps
        # the previously published values instead of overwriting them.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Monitored repos default to the keys of config/internal-contributors.json.
          # Set a repository variable only to override that list.
          MONITOR_REPOS: ${{ vars.MONITOR_REPOS }}
          MONITOR_MAX_LIST_PAGES: '40'
          MONITOR_BOTS: ${{ vars.MONITOR_BOTS }}
        run: npm run collect

      - name: Build static site
        # Relative base (./) keeps assets and ./data/*.json working both for
        # project pages (/<repo>/) and for a <user>.github.io root site.
        env:
          VITE_BASE: './'
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4