name: Create board

# Create a per-repository board without copying the single-repo template or
# creating another repository. The board lives on an orphan branch
# `board/<owner>/<repo>` in this repository; Deploy to GitHub Pages assembles
# every board branch under /boards/<owner>/<repo>/.

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Source repository to display, owner/repository
        required: true
        type: string
      config_json:
        description: Optional board configuration JSON (label, workflows, branch_lines, review_sla_days, stale_days)
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: create-board
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve source repository
        id: source
        env:
          SOURCE: ${{ inputs.source_repository }}
        run: |
          gh api "repos/$SOURCE" > "$RUNNER_TEMP/source.json"
          python3 - "$RUNNER_TEMP/source.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              meta = json.load(handle)
          full = meta.get("full_name") or ""
          private = bool(meta.get("private"))
          visibility = meta.get("visibility", "public")
          if private or visibility != "public":
              raise SystemExit(f"source repository must be public, got {full!r}")
          if meta.get("archived"):
              raise SystemExit(f"source repository is archived: {full}")
          key = full.lower()
          if not re.fullmatch(r"[a-z0-9_.-]+/[a-z0-9_.-]+", key):
              raise SystemExit(f"invalid source repository: {full!r}")
          if key == os.environ["GITHUB_REPOSITORY"].lower():
              raise SystemExit("the dashboard repository cannot be its own board source")
          print(f"full_name={full}")
          print(f"key={key}")
          print(f"branch=board/{key}")
          print(f"board_url=https://agent-ci-infra.github.io/dashboard/boards/{key}/")
          PY

      - name: Check for an existing board
        id: existing
        run: |
          BRANCH='${{ steps.source.outputs.branch }}'
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::branch $BRANCH already exists; boards are updated in place by Collect board data"
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create the board branch
        env:
          BRANCH: ${{ steps.source.outputs.branch }}
          FULL_NAME: ${{ steps.source.outputs.full_name }}
          BOARD_URL: ${{ steps.source.outputs.board_url }}
          CONFIG_JSON: ${{ inputs.config_json }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          git -C "$tmp" init -q
          git -C "$tmp" config user.name 'github-actions[bot]'
          git -C "$tmp" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$tmp" symbolic-ref HEAD "refs/heads/$BRANCH"

          args=(--source "$FULL_NAME" --board "$GITHUB_REPOSITORY" --output "$tmp/board-config.json")
          if [ -n "$CONFIG_JSON" ]; then
            args+=(--json "$CONFIG_JSON")
          fi
          python3 "$GITHUB_WORKSPACE/single-repo/setup.py" "${args[@]}"

          python3 - "$tmp/board-config.json" "$FULL_NAME" <<'PY'
          import json, sys
          config = json.loads(open(sys.argv[1], encoding="utf-8").read())
          if [key.lower() for key in config.get("deployments", {})] != [sys.argv[2].lower()]:
              raise SystemExit("config_json source_repository must match the source_repository input")
          PY

          cat > "$tmp/README.md" <<EOF
          # Board: $FULL_NAME

          This data-only branch holds the single-repository dashboard for
          \`$FULL_NAME\`. It is generated by [\`Collect board data\`](../actions/workflows/board-collect.yml)
          on \`main\`; do not edit it by hand.

          - Board: $BOARD_URL
          - Public sources only. Private repositories are local-only.
          - \`board-config.json\` is the source/display configuration.
          - \`site/data/\` is the published snapshot and history.
          - \`.sync/\` is incremental collection state.
          EOF

          git -C "$tmp" add board-config.json README.md
          git -C "$tmp" commit -q -m "chore: create board for $FULL_NAME"
          gh auth setup-git
          git -C "$tmp" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$tmp" push -q origin "HEAD:refs/heads/$BRANCH"

      - name: Start the first collection
        env:
          BOARD_KEY: ${{ steps.source.outputs.key }}
        run: gh workflow run board-collect.yml --ref main -f board="$BOARD_KEY"

      - name: Summary
        env:
          FULL_NAME: ${{ steps.source.outputs.full_name }}
          BOARD_URL: ${{ steps.source.outputs.board_url }}
          BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          {
            echo "### Board created"
            echo
            echo "- Source: \`$FULL_NAME\`"
            echo "- Data branch: \`$BRANCH\`"
            echo "- Board URL: $BOARD_URL"
            echo
            echo "Collection starts automatically; the first snapshot appears after"
            echo "\`Collect board data\` and \`Deploy to GitHub Pages\` finish."
          } >> "$GITHUB_STEP_SUMMARY"
