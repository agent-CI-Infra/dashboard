name: Collect DigitalMate cloud request metrics
on:
  push:
    branches: [main]
    paths:
      - scripts/collect-production-workspace-traces.py
      - scripts/collect-production-sfs-traces.py
      - scripts/collect-production-kube-traces.py
      - scripts/kube-workspace-remote.py
      - scripts/collect-cloud-request-metrics.py
      - scripts/collect-sfs-trajectory-archive.py
      - scripts/sfs-trajectory-remote.py
      - scripts/production_sfs_api.py
      - scripts/production_sfs_freshness.py
      - scripts/production_reply_metrics.py
      - scripts/production_cloud_replies.py
      - scripts/production_cluster_exec.py
      - scripts/collect-production-cloud-replies.py
  workflow_dispatch:
    inputs:
      validate_only:
        description: Collect and validate without publishing
        required: false
        default: false
        type: boolean
      refresh_if_due:
        description: Collect only if this hour has no published SFS archive
        required: false
        default: false
        type: boolean
  schedule:
    # These two triggers allow one successful collection per hour.
    - cron: '10,40 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: collect-cloud-request-metrics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether SFS data needs refresh
        id: freshness
        env:
          REFRESH_IF_DUE: ${{ inputs.refresh_if_due }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          set -euo pipefail
          # An operator or a validation run can always request a fresh snapshot.
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$VALIDATE_ONLY" = true ] || { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REFRESH_IF_DUE" != true ]; }; then
            echo 'collect=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/cloud-metrics
          git fetch origin digitalmate:refs/remotes/origin/digitalmate
          if git show origin/digitalmate:site/data/trajectory-archive/index.json > /tmp/cloud-metrics/freshness.json; then
            git show origin/digitalmate:site/data/env-request-latency-daily.json > /tmp/cloud-metrics/metrics-freshness.json || true
            due=$(python3 scripts/production_sfs_freshness.py /tmp/cloud-metrics/freshness.json /tmp/cloud-metrics/metrics-freshness.json)
          else
            due=true
          fi
          echo "collect=$due" >> "$GITHUB_OUTPUT"
          if [ "$due" = false ]; then
            echo 'Recent SFS snapshot exists; skipping redundant scheduled read.'
          fi
      - name: Collect SFS trajectory archive and cloud metrics
        if: steps.freshness.outputs.collect == 'true'
        env:
          ADX_TOKEN: ${{ secrets.ADX_TOKEN }}
          ADX_BINDING_TRANSPORT: sfs-ssh
          SFS_SSH_PRIVATE_KEY: ${{ secrets.SFS_SSH_PRIVATE_KEY }}
          PRODUCTION_KUBE_READ_CREDENTIALS: ${{ secrets.PRODUCTION_KUBE_READ_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "$ADX_TOKEN" ]; then
            echo '::error::ADX_TOKEN is not configured.'
            exit 1
          fi
          if [ -z "$SFS_SSH_PRIVATE_KEY" ]; then
            echo '::error::SFS_SSH_PRIVATE_KEY is not configured.'
            exit 1
          fi
          key_file="$RUNNER_TEMP/production-sfs-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$SFS_SSH_PRIVATE_KEY" > "$key_file"
          unset SFS_SSH_PRIVATE_KEY
          export SFS_SSH_KEY_FILE="$key_file"
          export SFS_KNOWN_HOSTS_FILE="$GITHUB_WORKSPACE/config/production-sfs-known-hosts"
          mkdir -p /tmp/cloud-metrics
          git fetch origin digitalmate:refs/remotes/origin/digitalmate
          git show origin/digitalmate:site/data/env-request-latency-daily.json \
            > /tmp/cloud-metrics/previous.json
          metrics_args=()
          if python3 scripts/collect-production-sfs-traces.py \
              /tmp/cloud-metrics/env-request-latency-daily.json \
              /tmp/cloud-metrics/previous.json; then
            metrics_args=(--metrics /tmp/cloud-metrics/env-request-latency-daily.json)
          else
            echo '::warning::Cloud log collection failed; retaining the prior cloud metrics.'
            cp /tmp/cloud-metrics/previous.json /tmp/cloud-metrics/env-request-latency-daily.json
          fi
          # Persistent cursor and archive are restored together. Raw SFS files
          # never leave the SSH host; only allowlisted timing fields are sent.
          git worktree add --detach /tmp/cloud-metrics/seed origin/digitalmate
          python3 scripts/collect-sfs-trajectory-archive.py \
            --state /tmp/cloud-metrics/seed/.sync/trajectory-archive.json \
            --previous /tmp/cloud-metrics/seed/site/data/trajectory-archive \
            --output /tmp/cloud-metrics/trajectory-archive \
            --next-state /tmp/cloud-metrics/trajectory-archive-state.json \
            "${metrics_args[@]}"
          python3 -B scripts/collect-production-cloud-replies.py \
            /tmp/cloud-metrics/env-request-latency-daily.json \
            /tmp/cloud-metrics/seed/.sync/cloud-reply-state.json \
            /tmp/cloud-metrics/cloud-reply-state.json
      - name: Publish aggregate to the DigitalMate data branch
        if: ${{ steps.freshness.outputs.collect == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.validate_only) }}
        id: update
        run: |
          set -euo pipefail
          git fetch origin digitalmate:refs/remotes/origin/digitalmate
          git checkout -B digitalmate origin/digitalmate
          cp /tmp/cloud-metrics/env-request-latency-daily.json site/data/env-request-latency-daily.json
          mkdir -p site/data/trajectory-archive .sync
          rsync -a --delete /tmp/cloud-metrics/trajectory-archive/ site/data/trajectory-archive/
          cp /tmp/cloud-metrics/trajectory-archive-state.json .sync/trajectory-archive.json
          cp /tmp/cloud-metrics/cloud-reply-state.json .sync/cloud-reply-state.json
          git add site/data/env-request-latency-daily.json site/data/trajectory-archive .sync/trajectory-archive.json .sync/cloud-reply-state.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(digitalmate): update cloud request metrics'
          git pull --rebase origin digitalmate
          git push origin HEAD:digitalmate
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Deploy dashboard
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
